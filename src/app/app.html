@if (!sesionIniciada) {
  <div class="caja-login">
    <h2>Iniciar Sesión / Registro</h2>

    <p>
      <label>Usuario:</label><br>
      <input type="text" [(ngModel)]="usuario">
    </p>

    <p>
      <label>Contraseña:</label><br>
      <input type="password" [(ngModel)]="clave">
    </p>

    <button (click)="iniciar()">Entrar</button>
    <button (click)="registrar()">Registrar</button>

    <p>{{ mensaje }}</p>
  </div>
} @else {
  <div class = "anadirproductos"> 
  <h2>Bienvenido</h2>
  <button (click)="cerrarSesion()">Cerrar Sesión</button>
  <hr>
    
    <h3>Gestión de Productos (DummyJSON)</h3>
    <input type="text" [(ngModel)]="nuevoProducto" placeholder="Nombre del nuevo producto">
    <button (click)="crearProducto()">Añadir Producto</button>
    
    <p style="color: blue;">{{ mensajeCrud }}</p>
    <ul>
      @for (prod of productos; track prod.id) {
        <li style="margin-bottom: 10px;">
          <strong>{{ prod.title }}</strong> 
          <button (click)="actualizarProducto(prod.id)" style="margin-left: 10px;">Editar</button>
          <button (click)="eliminarProducto(prod.id)">Borrar</button>
        </li>
      }
    </ul>
  </div>
}
